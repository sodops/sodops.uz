  </text>

  <!-- Bottom Divider -->
  <line x1="80" y1="475" x2="1120" y2="475" stroke="#262626" stroke-width="1.5"/>

  <!-- Footer Tags -->
  <text x="80" y="525" font-family="monospace, Courier, sans-serif" font-size="16" fill="#10b981">
    [k3s]  [Docker]  [Prometheus]  [Loki]  [Cloudflare Workers]  [D1]
